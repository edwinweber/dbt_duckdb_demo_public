# See docker/DOCKER_USAGE.md "One-Time Host Setup" for the host directory
# permissions (mkdir/chown/chmod) this file assumes.

x-path-overrides: &path-overrides
  DANISH_DEMOCRACY_BASE_URL: "https://oda.ft.dk/api"
  # DANISH_DEMOCRACY_DATA_SOURCE / RFAM_DATA_SOURCE default to the container-side
  # mount matching the LOCAL_STORAGE_PATH override below (/data/local). This is
  # what RAW_STORAGE_TARGET=local (the default) needs — .env's own value for
  # these vars is a *host* absolute path (correct for non-docker runs), which
  # doesn't exist inside the container, so leaving them unset here made every
  # docker Bronze read look in the wrong place.
  # For RAW_STORAGE_TARGET=s3, set DANISH_DEMOCRACY_DATA_SOURCE_DOCKER /
  # RFAM_DATA_SOURCE_DOCKER in .env to the s3:// URIs instead — S3 URIs are
  # location-independent, so they don't need a separate host/container form.
  DANISH_DEMOCRACY_DATA_SOURCE: ${DANISH_DEMOCRACY_DATA_SOURCE_DOCKER:-/data/local/Files/Bronze/DDD}
  RFAM_DATA_SOURCE: ${RFAM_DATA_SOURCE_DOCKER:-/data/local/Files/Bronze/RFAM}
  DLT_PIPELINES_DIR: /data/dlt_pipelines
  DUCKDB_DATABASE_LOCATION: /data/duckdb/danish_democracy_data.duckdb
  DUCKDB_DATABASE: danish_democracy_data
  DBT_PROJECT_DIRECTORY: /app/dbt
  DBT_MODELS_DIRECTORY: /app/dbt/models
  DBT_LOGS_DIRECTORY: /data/dbt_logs
  DAGSTER_HOME: /data/dagster
  LOCAL_STORAGE_PATH: /data/local
  # Quack server host — overridden to "" on the server itself so it doesn't
  # try to connect to itself.  QUACK_SERVER_TOKEN is NOT in this anchor because
  # the :? fail-fast must only trigger when a service is actually started, not
  # during docker compose build (which doesn't evaluate environment: sections).
  # Each consuming service adds QUACK_SERVER_TOKEN explicitly below.
  QUACK_SERVER_HOST: duckdb_server

x-common: &common
  env_file: .env
  environment:
    <<: *path-overrides

# Three lean images: ddd-duckdb-server and ddd-backup (two targets of
# docker/Dockerfile.duckdb_server, sharing their base layers) and ddd-dagster
# (docker/Dockerfile.dagster, for the services dagster and run).
x-dagster-image: &dagster-image
  build:
    context: .
    dockerfile: docker/Dockerfile.dagster
  image: ddd-dagster:latest

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ── DuckDB 2.0 quack server ─────────────────────────────────────────────
  # The sole read-write owner of the .duckdb file and the DuckLake catalog.
  # All other containers connect to it as quack clients.
  # dbt's dbt-quack wrapper sets QUACK_CONNECT_DATABASE so every cursor runs
  # CONNECT danish_democracy_data automatically.
  duckdb_server:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.duckdb_server
      target: duckdb_server
    image: ddd-duckdb-server:latest
    container_name: ddd-duckdb-server
    command: ["python", "-m", "ddd_python.ddd_dlt.duckdb_quack_server"]
    environment:
      <<: *path-overrides
      # dbt seeds are loaded by dbt running server-side (CONNECT mode), so the
      # server must see the seed CSV files at the dbt container's path.
      DBT_PROJECT_DIRECTORY: /app/dbt
      QUACK_SERVER_HOST: ""  # the server itself does not connect to itself
      # The server reads the token at startup and refuses if it is missing or <4 chars.
      QUACK_SERVER_TOKEN: ${QUACK_SERVER_TOKEN:?QUACK_SERVER_TOKEN must be set in .env (min 4 characters)}
    volumes:
      # DuckDB 2.0 main database (read-write; sole mount)
      - /data/duckdb:/data/duckdb
      # DuckLake catalog + Parquet data (read-write when SILVER_STORAGE_FORMAT=ducklake)
      - /data/ducklake:/data/ducklake
      # Bronze files (read-only; Bronze views reference these paths server-side)
      - /data/local:/data/local:ro
      # Dagster SQLite (writable; sqlite_scan needs WAL lock even for reads)
      - /data/dagster:/data/dagster
      # dbt seed CSVs (read-only; server-side seed load needs them at the dbt path)
      - ./dbt/seeds:/app/dbt/seeds:ro
    # Published so remote quack clients (DBeaver, Python, another host) can connect:
    #   ATTACH 'quack:<host>:<QUACK_SERVER_HOST_PORT>' AS qk (TOKEN '<token>', DISABLE_SSL true);
    # The server currently serves plain HTTP (disable_ssl), so the token and the data are not
    # encrypted on the wire. Set QUACK_SERVER_BIND=127.0.0.1 to keep the port on the host
    # only, or put the host behind a VPN/SSH tunnel; see docker/DOCKER_USAGE.md.
    ports:
      - "${QUACK_SERVER_BIND:-0.0.0.0}:${QUACK_SERVER_HOST_PORT:-9494}:9494"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',9494)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Generic runner for one-off Python tasks ─────────────────────────────
  # Usage: docker compose run --rm run python -m <module>
  # Examples:
  #   docker compose run --rm run python -m ddd_python.ddd_dlt.dlt_run_extraction_pipelines_danish_parliament_data
  #   docker compose run --rm run python -m ddd_python.ddd_dbt.generate_dbt_models
  #   docker compose run --rm run python -m ddd_python.ddd_dbt.dbt_build_with_unique_logfile
  #   docker compose run --rm run python -m ddd_python.ddd_dlt.export_silver
  #   docker compose run --rm run python -m ddd_python.ddd_dlt.export_gold
  run:
    <<: [*common, *dagster-image]
    container_name: ddd-run
    command: ["python", "-m"]
    environment:
      <<: *path-overrides
      DBT_EXECUTABLE: dbt-quack
      QUACK_SERVER_TOKEN: ${QUACK_SERVER_TOKEN:?QUACK_SERVER_TOKEN must be set in .env (min 4 characters)}
    volumes:
      - /data/dlt_pipelines:/data/dlt_pipelines
      - /data/dbt_logs:/data/dbt_logs
      - /data/local:/data/local
      - /data/dagster:/data/dagster
    depends_on:
      duckdb_server:
        condition: service_healthy

  # ── Backup: one-off backup of platform databases ────────────────────────
  # Usage:  docker compose run --rm backup
  #         docker compose run --rm backup python -m ddd_python.ddd_utils.backup_platform --targets dagster
  #         docker compose run --rm backup python -m ddd_python.ddd_utils.restore_platform
  #
  # Source dirs and backup output dirs are bind-mounted from the host so the
  # container shares exactly the same paths the backup Python code expects.
  # The Docker socket is mounted so the backup script can stop/start ddd-duckdb-server.
  # HOST_SSH_DIR is mounted read-only for rsync/SSH uploads to Hetzner StorageBox.
  backup:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile.duckdb_server
      target: backup
    image: ddd-backup:latest
    container_name: ddd-backup
    # Default command: back up all targets. Override the whole python invocation
    # when passing --targets, e.g. via `docker compose run --rm backup python -m ...`
    command: ["python", "-m", "ddd_python.ddd_utils.backup_platform"]
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      <<: *path-overrides
      METABASE_DATA_DIR: /data/metabase/data
      BACKUP_LOG_DIR: /data_backup/logs
      DAGSTER_BACKUP_DIR: /data_backup/dagster
      METABASE_BACKUP_DIR: /data_backup/metabase
      DUCKDB_BACKUP_DIR: /data_backup/duckdb
      # DuckLake data-files backup (only used when SILVER_STORAGE_FORMAT=ducklake,
      # which is read from .env). The catalog rides along in the duckdb backup.
      DUCKLAKE_BACKUP_DIR: /data_backup/ducklake
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/dagster:/data/dagster
      - /data/metabase/data:/data/metabase/data
      - /data/duckdb:/data/duckdb
      - /data/ducklake:/data/ducklake
      - /data_backup:/data_backup
      - ${HOST_SSH_DIR:-/root/.ssh}:/home/app/.ssh:ro

  # ── Dagster: webserver + daemon or one-off job execution ────────────────
  # UI:       docker compose up dagster
  # Full job: docker compose run --rm dagster dagster job execute -m ddd_python.ddd_dagster.definitions -j full_pipeline_job
  # Run individual DDD-extraction in Dagster Launchpad:
  # ops: {"ingestion__DDD__stemme": {"config": {"date_to_load_from": "2025-01-01"}}}
  # resources:
  #  dlt_onelake:
  #   config:
  #    source_system_code: DDD
  dagster:
    <<: [*common, *dagster-image]
    container_name: ddd-dagster
    command: ["dagster", "dev", "-w", "workspace.yaml", "-h", "0.0.0.0", "-p", "3000"]
    environment:
      <<: *path-overrides
      DBT_EXECUTABLE: dbt-quack
      QUACK_SERVER_TOKEN: ${QUACK_SERVER_TOKEN:?QUACK_SERVER_TOKEN must be set in .env (min 4 characters)}
      # CONNECT tells each dbt cursor to run CONNECT <db> after ATTACH
      QUACK_CONNECT_DATABASE: danish_democracy_data
    ports:
      - "3000:3000"
    volumes:
      - /data/dlt_pipelines:/data/dlt_pipelines
      - /data/dbt_logs:/data/dbt_logs
      - /data/dagster:/data/dagster
      - /data/local:/data/local
    depends_on:
      duckdb_server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
    logging: *logging
    healthcheck:
      # Python, not curl: the image has no system packages beyond the slim base.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:3000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Metabase: BI / dashboarding via quack client ─────────────────────────
  # UI: docker compose up metabase  →  http://localhost:3001
  #
  # One-time Metabase setup (Admin → Databases → Add database → DuckDB):
  #   Database path:  :memory:
  #   Init SQL:       paste the rendered /metabase-data/duckdb-init.sql
  #                   (the entrypoint writes it with the real token substituted)
  #
  # The entrypoint renders docker/metabase-duckdb-init.sql into
  # /metabase-data/duckdb-init.sql using QUACK_SERVER_TOKEN from the env.
  # The rendered file is on the host at $METABASE_DATA_DIR/duckdb-init.sql.
  # Never paste the token into the Metabase UI directly from a terminal where
  # it might appear in shell history.
  metabase:
    build:
      context: .
      dockerfile: docker/Dockerfile.metabase
    image: ddd-metabase:latest
    container_name: ddd-metabase
    ports:
      - "3001:3000"
    volumes:
      - ${METABASE_DATA_DIR:-/data/metabase/data}:/metabase-data
      - /data/metabase/duckdb-extensions:/home/metabase/.duckdb/extensions
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      # Token passed so the entrypoint can render the init SQL without the user
      # having to copy/paste it by hand.  Never echoed to Metabase itself.
      QUACK_SERVER_TOKEN: ${QUACK_SERVER_TOKEN:?QUACK_SERVER_TOKEN must be set in .env (min 4 characters)}
    depends_on:
      duckdb_server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
