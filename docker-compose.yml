# Path variables (DAGSTER_HOME, DLT_PIPELINES_DIR, DUCKDB_DATABASE_LOCATION, etc.)
# are set in .env with local paths. The environment: overrides below remap them
# to the container volume mount paths, taking precedence over env_file values.
#
# ── Host directory permissions ───────────────────────────────────────────────
# All pipeline containers (run, dagster, backup) run as app (UID 1000).
# Metabase runs as UID 2000. Both UIDs access shared bind-mounted directories,
# so permissions must allow each UID to read/write what it needs.
#
# Run ONCE on the host before the first container start:
#
#   # Create directories
#   sudo mkdir -p /data/{dlt_pipelines,duckdb,dbt_logs,dagster,local,metabase/data,metabase/duckdb-extensions}
#   sudo mkdir -p /data_backup/{dagster,metabase,logs}
#
#   # app (UID 1000) owns the pipeline and backup directories
#   sudo chown -R 1000:1000 /data/dlt_pipelines /data/dbt_logs /data/dagster /data/local
#   sudo chown -R 1000:1000 /data/duckdb /data_backup
#
#   # Metabase (UID 2000) owns its state directories
#   sudo chown -R 2000:2000 /data/metabase/data /data/metabase/duckdb-extensions
#
#   # DuckDB creates WAL/lock files even during read-only queries (Metabase reads
#   # the .duckdb file). o+rwx lets UID 2000 write into the UID-1000-owned dir.
#   chmod -R o+rwx /data/duckdb
#
#   # DuckLake Parquet data: Metabase (UID 2000) reads Silver via DuckLake views.
#   sudo mkdir -p /data/ducklake
#   sudo chown -R 1000:1000 /data/ducklake
#   chmod -R o+rx /data/ducklake
#
#   # backup (UID 1000) reads Metabase data (owned by UID 2000) to create archives
#   chmod -R o+rX /data/metabase/data
#
# ── Docker socket access ──────────────────────────────────────────────────────
# Services that talk to Docker (dagster, backup) need to be in the socket's
# group.  DOCKER_GID must match the GID of /var/run/docker.sock on the host.
# Add it to .env once:
#
#   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> .env
#
# ─────────────────────────────────────────────────────────────────────────────

x-path-overrides: &path-overrides
  DANISH_DEMOCRACY_BASE_URL: "https://oda.ft.dk/api"
  DANISH_DEMOCRACY_DATA_SOURCE: /data/local/Files/Bronze/DDD
  RFAM_DATA_SOURCE: /data/local/Files/Bronze/RFAM
  DLT_PIPELINES_DIR: /data/dlt_pipelines
  DUCKDB_DATABASE_LOCATION: /data/duckdb/danish_democracy_data.duckdb
  DUCKDB_DATABASE: danish_democracy_data
  DBT_PROJECT_DIRECTORY: /app/dbt
  DBT_MODELS_DIRECTORY: /app/dbt/models
  DBT_LOGS_DIRECTORY: /data/dbt_logs
  DAGSTER_HOME: /data/dagster
  LOCAL_STORAGE_PATH: /data/local

x-common: &common
  build: .
  image: danish-democracy-data:latest
  env_file: .env
  environment:
    <<: *path-overrides

services:
  # ── Generic runner for one-off Python tasks ─────────────────────────────
  # Usage: docker compose run --rm run <module>
  # Examples:
  #   docker compose run --rm run ddd_python.ddd_dlt.dlt_run_extraction_pipelines_danish_parliament_data
  #   docker compose run --rm run ddd_python.ddd_dbt.generate_dbt_models
  #   docker compose run --rm run ddd_python.ddd_dbt.dbt_build_with_unique_logfile
  #   docker compose run --rm run ddd_python.ddd_dlt.export_main_silver_to_fabric_silver
  #   docker compose run --rm run ddd_python.ddd_dlt.export_main_gold_to_fabric_gold
  run:
    <<: *common
    container_name: ddd-run
    command: ["python", "-m"]
    volumes:
      - /data/dlt_pipelines:/data/dlt_pipelines
      - /data/duckdb:/data/duckdb
      - /data/dbt_logs:/data/dbt_logs
      - /data/local:/data/local

  # ── Backup: one-off backup of platform databases ────────────────────────
  # Usage:  docker compose run --rm backup
  #         docker compose run --rm backup python -m ddd_python.ddd_utils.backup_platform --targets dagster
  #         docker compose run --rm backup python -m ddd_python.ddd_utils.restore_platform
  #
  # Source dirs and backup output dirs are bind-mounted from the host so the
  # container shares exactly the same paths the backup Python code expects.
  # The Docker socket is mounted so the backup script can stop/start the
  # other containers without needing docker on the host.
  # HOST_SSH_DIR is mounted read-only for rsync/SSH uploads to Hetzner StorageBox.
  backup:
    <<: *common
    container_name: ddd-backup
    # Default command: back up all targets. Override the whole python invocation
    # when passing --targets, e.g. via `docker compose run --rm backup python -m ...`
    command: ["python", "-m", "ddd_python.ddd_utils.backup_platform"]
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      <<: *path-overrides
      METABASE_DATA_DIR: /data/metabase/data
      BACKUP_LOG_DIR: /data_backup/logs
      DAGSTER_BACKUP_DIR: /data_backup/dagster
      METABASE_BACKUP_DIR: /data_backup/metabase
      DUCKDB_BACKUP_DIR: /data_backup/duckdb
      # DuckLake data-files backup (only used when SILVER_STORAGE_FORMAT=ducklake,
      # which is read from .env). The catalog rides along in the duckdb backup.
      DUCKLAKE_BACKUP_DIR: /data_backup/ducklake
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/dagster:/data/dagster
      - /data/metabase/data:/data/metabase/data
      - /data/duckdb:/data/duckdb
      - /data/ducklake:/data/ducklake
      - /data_backup:/data_backup
      - ${HOST_SSH_DIR:-/root/.ssh}:/home/app/.ssh:ro

  # ── Dagster: webserver + daemon or one-off job execution ────────────────
  # UI:       docker compose up dagster
  # Full job: docker compose run --rm dagster job execute -j full_pipeline_job -w workspace.yaml
  # Run individual DDD-extraction in Dagster Launchpad:
  # ops: {"ingestion__DDD__stemme": {"config": {"date_to_load_from": "2025-01-01"}}}
  # resources:
  #  dlt_onelake:
  #   config:
  #    source_system_code: DDD
  dagster:
    <<: *common
    container_name: ddd-dagster
    command: ["dagster", "dev", "-w", "workspace.yaml", "-h", "0.0.0.0", "-p", "3000"]
    # Docker socket: Dagster jobs stop/start the Metabase container around dbt
    # runs to satisfy DuckDB's single-writer constraint.
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/dlt_pipelines:/data/dlt_pipelines
      - /data/duckdb:/data/duckdb
      - /data/ducklake:/data/ducklake
      - /data/dbt_logs:/data/dbt_logs
      - /data/dagster:/data/dagster
      - /data/local:/data/local
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Metabase: BI / dashboarding on DuckDB via MotherDuck driver ─────────
  # UI: docker compose up metabase  →  http://localhost:3001
  # In the Metabase setup wizard choose "DuckDB" and set the database path to:
  #   /data/duckdb/danish_democracy_data.duckdb
  # The init-script for the DuckDB connection is:
  # INSTALL icu; LOAD icu;
  # INSTALL httpfs; LOAD httpfs;
  # INSTALL delta; LOAD delta;
  # INSTALL sqlite; LOAD sqlite;
  # LOAD ducklake; ATTACH 'ducklake:/data/duckdb/ducklake_catalog.ducklake' AS ducklake_catalog (DATA_PATH '/data/ducklake');
  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    image: ddd-metabase:latest
    container_name: ddd-metabase
    ports:
      - "3001:3000"
    volumes:
      - /data/duckdb:/data/duckdb
      - /data/ducklake:/data/ducklake
      - /data/dagster:/data/dagster
      - /data/local:/data/local:ro
      - ${METABASE_DATA_DIR:-/data/metabase/data}:/metabase-data
      - /data/metabase/duckdb-extensions:/home/metabase/.duckdb/extensions
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
