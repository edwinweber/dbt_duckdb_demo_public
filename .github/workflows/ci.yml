name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python tests ────────────────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dagster,dev]"

      - name: Generate dbt manifest
        run: |
          dbt deps --project-dir dbt/ --profiles-dir dbt/
          dbt parse --project-dir dbt/ --profiles-dir dbt/
        env:
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: duckdb
          LOCAL_STORAGE_PATH: /tmp/ddd_ci
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/ddd_ci/Files/Bronze/DDD
          RFAM_DATA_SOURCE: /tmp/ddd_ci/Files/Bronze/RFAM
          DUCKDB_DATABASE_LOCATION: /tmp/ddd_ci/test.duckdb
          DUCKDB_DATABASE: danish_democracy_data
          DBT_PROJECT_DIRECTORY: ${{ github.workspace }}/dbt
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=ddd_python --cov-fail-under=80 --cov-report=term-missing
        env:
          # Minimal env vars required by the lazy env-loading module.
          # Tests use monkeypatch / MagicMock for everything else.
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: duckdb
          LOCAL_STORAGE_PATH: /tmp/ddd_ci
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/ddd_ci/Files/Bronze/DDD
          RFAM_DATA_SOURCE: /tmp/ddd_ci/Files/Bronze/RFAM
          DUCKDB_DATABASE_LOCATION: /tmp/ddd_ci/test.duckdb
          DUCKDB_DATABASE: danish_democracy_data
          DLT_PIPELINES_DIR: /tmp/ddd_ci/pipelines_dir
          DLT_PIPELINE_RUN_LOG_DIR: /tmp/ddd_ci/logs
          DBT_PROJECT_DIRECTORY: ${{ github.workspace }}/dbt
          DBT_MODELS_DIRECTORY: ${{ github.workspace }}/dbt/models
          DBT_LOGS_DIRECTORY: /tmp/ddd_ci/dbt/logs
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"
          DAGSTER_HOME: /tmp/ddd_ci/dagster
          DANISH_DEMOCRACY_BASE_URL: https://oda.ft.dk/api
          DANISH_DEMOCRACY_DEFAULT_DAYS_TO_LOAD: "31"
          RFAM_CONNECTION_STRING: "mysql+pymysql://rfamro@mysql-rfam-public.ebi.ac.uk:4497/Rfam"
          RFAM_DEFAULT_DAYS_TO_LOAD: "365"

  # ── dbt SQL validation ──────────────────────────────────────────────────────
  dbt-validate:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt
        env:
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: duckdb
          DUCKDB_DATABASE_LOCATION: /tmp/ci_test.duckdb
          DUCKDB_DATABASE: ci_test
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/bronze_ddd
          RFAM_DATA_SOURCE: /tmp/bronze_rfam
          DBT_PROJECT_DIRECTORY: dbt/
          LOCAL_STORAGE_PATH: /tmp
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"

      - name: dbt parse — duckdb mode (validates all SQL + YAML, no database needed)
        run: dbt parse --project-dir dbt --profiles-dir dbt --target local
        env:
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: duckdb
          DUCKDB_DATABASE_LOCATION: /tmp/ci_test.duckdb
          DUCKDB_DATABASE: ci_test
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/bronze_ddd
          RFAM_DATA_SOURCE: /tmp/bronze_rfam
          DBT_PROJECT_DIRECTORY: dbt/
          LOCAL_STORAGE_PATH: /tmp
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"

      - name: dbt parse — ducklake mode (validates DuckLake target SQL + YAML)
        run: dbt parse --project-dir dbt --profiles-dir dbt --target local_ducklake
        env:
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: ducklake
          DUCKDB_DATABASE_LOCATION: /tmp/ci_ducklake_test.duckdb
          DUCKDB_DATABASE: ci_ducklake_test
          DUCKLAKE_CATALOG_LOCATION: /tmp/ci_ducklake.ducklake
          DUCKLAKE_DATA_PATH: /tmp/ci_ducklake_data
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/bronze_ddd
          RFAM_DATA_SOURCE: /tmp/bronze_rfam
          DBT_PROJECT_DIRECTORY: dbt/
          LOCAL_STORAGE_PATH: /tmp
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"

      - name: dbt parse — ducklake+s3 mode (validates local_ducklake_s3 target SQL + YAML)
        run: dbt parse --project-dir dbt --profiles-dir dbt --target local_ducklake_s3
        env:
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: ducklake
          RAW_STORAGE_TARGET: s3
          DUCKDB_DATABASE_LOCATION: /tmp/ci_ducklake_s3_test.duckdb
          DUCKDB_DATABASE: ci_ducklake_s3_test
          DUCKLAKE_CATALOG_LOCATION: /tmp/ci_ducklake_s3.ducklake
          S3_ACCESS_KEY_ID: ci_fake_key
          S3_SECRET_ACCESS_KEY: ci_fake_secret
          S3_BUCKET_DUCKLAKE: ci-ducklake-bucket
          DANISH_DEMOCRACY_DATA_SOURCE: /tmp/bronze_ddd
          RFAM_DATA_SOURCE: /tmp/bronze_rfam
          DBT_PROJECT_DIRECTORY: dbt/
          LOCAL_STORAGE_PATH: /tmp
          DBT_FRESHNESS_WARN_AFTER_DAYS: "2"
          DBT_FRESHNESS_ERROR_AFTER_DAYS: "7"

  # ── S3 integration tests ──────────────────────────────────────────────
  test-s3:
    name: pytest (S3-compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Any S3-compatible server works for these tests; RustFS is the one used locally
      # (docker-compose.rustfs.yml).
      - name: Start S3-compatible server (RustFS)
        run: |
          sudo install -d -o 10001 -g 10001 /tmp/rustfs-data
          docker run -d \
            --name s3 \
            -p 9000:9000 \
            -v /tmp/rustfs-data:/data \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs:latest /data
          timeout 90 bash -c 'until curl -sf http://localhost:9000/health; do sleep 2; done'

      - name: Run S3 integration tests
        run: pytest tests/test_integration_s3_pipeline.py -v --tb=short
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY_ID: rustfsadmin
          S3_TEST_SECRET_ACCESS_KEY: rustfsadmin
          # Minimal env required by get_variables_from_env at import time
          STORAGE_TARGET: local
          SILVER_STORAGE_FORMAT: duckdb
          LOCAL_STORAGE_PATH: /tmp/ddd_s3_ci

  # ── Linting & type-checking ──────────────────────────────────────────────────
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dagster,dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy --package ddd_python --config-file pyproject.toml

  # ── Full dbt build on a committed sample ─────────────────────────────────────
  # Runs the real Bronze -> Silver -> Gold build plus every dbt test against a
  # small, referentially coherent slice of the source data
  # (tests/fixtures/bronze_sample, refresh with scripts/build_ci_sample.py).
  dbt-build-sample:
    name: dbt build (sample data)
    runs-on: ubuntu-latest
    env:
      STORAGE_TARGET: local
      SILVER_STORAGE_FORMAT: duckdb
      DUCKDB_DATABASE_LOCATION: ${{ github.workspace }}/ci_sample.duckdb
      DUCKDB_DATABASE: ci_sample
      DANISH_DEMOCRACY_DATA_SOURCE: ${{ github.workspace }}/tests/fixtures/bronze_sample/DDD
      RFAM_DATA_SOURCE: ${{ github.workspace }}/tests/fixtures/bronze_sample/RFAM
      DBT_PROJECT_DIRECTORY: ${{ github.workspace }}/dbt
      LOCAL_STORAGE_PATH: ${{ github.workspace }}/ci_sample_storage
      DBT_FRESHNESS_WARN_AFTER_DAYS: "100000"
      DBT_FRESHNESS_ERROR_AFTER_DAYS: "100000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # dagster: the dbt tests also check the Dagster side (row counts, data_engineering)
      - name: Install dependencies
        run: pip install -e ".[dagster,dev]"

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      # The data_engineering models read Dagster's own SQLite history, which
      # does not exist in CI.
      - name: dbt build (models + seeds + tests)
        run: dbt build --project-dir dbt --profiles-dir dbt --target local --exclude path:models/data_engineering

      - name: Check the Gold layer is populated
        run: python scripts/ci_check_sample_build.py "$DUCKDB_DATABASE_LOCATION"

      # Runs both Silver macros with dbt through every documented case
      # (dbt_transformations.md §3.10), in DuckDB and DuckLake mode, on copies of
      # the sample (a few minutes).
      - name: Silver logic (real dbt runs)
        run: pytest tests/test_dbt_silver.py tests/test_dbt_data_engineering.py -v
        env:
          DBT_INTEGRATION_TESTS: "1"

      # dbt-core has no --output-dir: docs land in dbt/target.  Publish only the
      # three files the site needs, not the compiled SQL next to them.
      - name: Generate dbt docs site
        run: |
          dbt docs generate --project-dir dbt --profiles-dir dbt --target local --exclude path:models/data_engineering
          mkdir dbt-docs-site
          cp dbt/target/index.html dbt/target/manifest.json dbt/target/catalog.json dbt-docs-site/

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt-docs-site

  # ── Publish the dbt docs (lineage + model docs) to GitHub Pages ─────────────
  # One-time setup:
  #   1) repo Settings -> Pages -> Source: "GitHub Actions"
  #   2) repo variable ENABLE_GITHUB_PAGES_PUBLISH=true
  publish-docs:
    name: publish dbt docs
    needs: dbt-build-sample
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Docker images ───────────────────────────────────────────────────────────
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # One cache scope per image, so the three builds do not overwrite each other's cache.
      - name: Build Dagster image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dagster
          push: false
          load: true
          tags: ddd-dagster:ci
          cache-from: type=gha,scope=dagster
          cache-to: type=gha,mode=max,scope=dagster

      - name: Build DuckDB server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.duckdb_server
          target: duckdb_server
          push: false
          load: true
          tags: ddd-duckdb-server:ci
          cache-from: type=gha,scope=duckdb_server
          cache-to: type=gha,mode=max,scope=duckdb_server

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.duckdb_server
          target: backup
          push: false
          load: true
          tags: ddd-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Smoke-test the images
        run: |
          docker run --rm --entrypoint dbt ddd-dagster:ci --version
          docker run --rm --entrypoint dbt-quack ddd-dagster:ci --version
          docker run --rm --entrypoint python ddd-dagster:ci -c "import ddd_python.ddd_dagster.definitions"
          docker run --rm ddd-duckdb-server:ci python -c "import numpy, ddd_python.ddd_dlt.duckdb_quack_server"
          docker run --rm ddd-backup:ci python -c "import ddd_python.ddd_utils.backup_platform, ddd_python.ddd_utils.restore_platform"
          docker run --rm ddd-backup:ci sh -c "docker --version && rsync --version | head -1 && ssh -V"
