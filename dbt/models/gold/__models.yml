version: 2

models:
  # ---------------------------------------------------------------------------
  # Dimension — Actor
  # ---------------------------------------------------------------------------
  - name: actor
    description: >
      SCD Type 2 history for actors (members, ministers, parties, …) of the
      Danish Parliament. One row per actor per version.
    columns:
      - name: LKHS_actor_id
        description: Surrogate key — hash of source system + id + valid_from.
        data_tests:
          - not_null
          - unique
      - name: actor_bk
        description: Business key in the form "DDD-{source_id}".
        data_tests:
          - not_null
      - name: LKHS_date_valid_from
        description: Start of the validity period for this version.
        data_tests:
          - not_null
      - name: LKHS_date_valid_to
        description: End of validity period. 9999-12-31 means the row is current.
        data_tests:
          - not_null

  - name: actor_cv
    description: Current-version view of actors — exactly one row per living actor.
    columns:
      - name: LKHS_actor_id
        data_tests:
          - not_null
          - unique

  - name: actor_type
    description: SCD Type 2 history for actor type (member, minister, party, …).
    columns:
      - name: LKHS_actor_type_id
        data_tests:
          - not_null
          - unique

  - name: actor_type_cv
    description: Current-version view of actor types.
    columns:
      - name: LKHS_actor_type_id
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Dimension — Case
  # ---------------------------------------------------------------------------
  - name: case
    description: Cases (bills, questions, reports, …) of the Danish Parliament.
    columns:
      - name: LKHS_case_id
        description: Surrogate key.
        data_tests:
          - not_null
          - unique

  - name: case_cv
    description: Current-version view of cases.
    columns:
      - name: LKHS_case_id
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Dimension — Date
  # ---------------------------------------------------------------------------
  - name: date
    description: >
      Classic calendar date dimension with year/quarter/month/week offsets,
      is_weekend flag, and Danish public holiday indicator.
    columns:
      - name: date_day
        description: The calendar date — primary key of this table.
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Dimension — Time
  # ---------------------------------------------------------------------------
  - name: time
    description: >
      Minute-grain time dimension covering all 1 440 minutes of the day.
      Used as a foreign-key target by the data_engineering observability models
      (dagster_run, dagster_asset_materialization, dagster_step_failure) where
      time_key = 100 * hour + minute matches the FK formula in those models.
    columns:
      - name: time_key
        description: >
          Primary key — integer encoding of HH:MM as (hour * 100 + minute).
          Ranges from 0 (00:00) to 2359 (23:59).
        data_tests:
          - not_null
          - unique
      - name: time_hhmm
        description: Human-readable HH:MM string (e.g. "09:05").
        data_tests:
          - not_null

  # ---------------------------------------------------------------------------
  # Dimension — Meeting
  # ---------------------------------------------------------------------------
  - name: meeting
    description: >
      Parliament meetings — current version only (filtered to LKHS_date_valid_to = '9999-12-31').
      Unlike other dimensions, `meeting` applies the current-version filter inline (WHERE
      LKHS_date_valid_to = '9999-12-31') rather than following the SCD2 + UNION ALL pattern
      used by actor, case, vote, etc. This is intentional: `individual_votes` joins directly
      to `meeting` and expects single-row-per-meeting output. The companion `meeting_cv` view
      is kept for API consistency with the other dimension pairs.
    columns:
      - name: LKHS_meeting_id
        data_tests:
          - not_null
          - unique

  - name: meeting_cv
    description: Current-version view of meetings.
    columns:
      - name: LKHS_meeting_id
        data_tests:
          - not_null
          - unique

  - name: meeting_status
    description: SCD Type 2 history for meeting status lookup.
    columns:
      - name: LKHS_meeting_status_id
        data_tests:
          - not_null
          - unique

  - name: meeting_status_cv
    description: Current-version view of meeting statuses.
    columns:
      - name: LKHS_meeting_status_id
        data_tests:
          - not_null
          - unique

  - name: meeting_type
    description: SCD Type 2 history for meeting type lookup.
    columns:
      - name: LKHS_meeting_type_id
        data_tests:
          - not_null
          - unique

  - name: meeting_type_cv
    description: Current-version view of meeting types.
    columns:
      - name: LKHS_meeting_type_id
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Fact — Vote (afstemning)
  # ---------------------------------------------------------------------------
  - name: vote
    description: >
      One row per vote (afstemning). Includes whether the proposal was adopted
      and the official conclusion text. SCD Type 2 history.
    columns:
      - name: LKHS_vote_id
        description: Surrogate key.
        data_tests:
          - not_null
          - unique
      - name: approved
        description: >
          Whether the proposal was adopted (1) or rejected (0).
          NULL may appear for procedural or cancelled votes.

  - name: vote_cv
    description: Current-version view of votes.
    columns:
      - name: LKHS_vote_id
        data_tests:
          - not_null
          - unique

  - name: vote_type
    description: >
      Lookup table for vote types (e.g. "Endelig vedtagelse", "Ændringsforslag").
      Also provides English translations.
    columns:
      - name: LKHS_vote_type_id
        data_tests:
          - not_null
          - unique
      - name: vote_type_english
        description: English translation of vote_type_danish.
        data_tests:
          - not_null

  - name: vote_type_cv
    description: Current-version view of vote types.
    columns:
      - name: LKHS_vote_type_id
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Fact — Individual Votes (stemme)
  # ---------------------------------------------------------------------------
  - name: individual_votes
    description: >
      One row per individual member vote (stemme). Links actors, votes, and
      voting position (for / against / neither). Only non-deleted rows are included.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "individual_vote_count > 0"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - LKHS_vote_id
              - LKHS_actor_id
    columns:
      - name: LKHS_actor_id
        description: FK to actor dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('actor')
                field: LKHS_actor_id
      - name: LKHS_vote_id
        description: FK to vote dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('vote')
                field: LKHS_vote_id
      - name: LKHS_meeting_id
        description: FK to meeting dimension.
        data_tests:
          - relationships:
              arguments:
                to: ref('meeting')
                field: LKHS_meeting_id
      - name: LKHS_case_id
        description: FK to case dimension.
        data_tests:
          - relationships:
              arguments:
                to: ref('case')
                field: LKHS_case_id
      - name: date_day
        description: FK to date dimension — DATE '1900-01-01' when meeting_date is NULL.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
      - name: individual_vote_count
        description: Always 1 — additive measure for counting individual votes.
        data_tests:
          - not_null