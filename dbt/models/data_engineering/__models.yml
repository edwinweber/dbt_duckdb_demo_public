version: 2

models:
  # ---------------------------------------------------------------------------
  # Dimension — Dagster jobs
  # ---------------------------------------------------------------------------
  - name: dagster_job
    description: >
      One row per unique Dagster job name ever observed in pipeline runs.
      Surrogate key derived from job_name via hash, consistent with the gold layer pattern.
    columns:
      - name: job_key
        description: Surrogate key — hash of job_name.
        data_tests:
          - not_null
          - unique
      - name: job_name
        description: Dagster job name.
        data_tests:
          - not_null
          - unique

  # ---------------------------------------------------------------------------
  # Staging — Dagster event log consolidation (TABLE)
  # ---------------------------------------------------------------------------
  - name: dagster_event_logs
    description: >
      One row per ASSET_MATERIALIZATION event, read from the Dagster consolidated
      SQLite event index at $DAGSTER_HOME/history/runs/index.db. Metadata fields
      (records_written, duration_seconds, the silver_* row counts, etc.) are extracted by
      label and flattened from the nested JSON event payload via a generate_series
      lateral join.
    columns:
      - name: event_id
        description: Dagster event_logs PK (id column) — joins dagster_asset_materialization.materialization_id.
        data_tests:
          - not_null
          - unique
      - name: run_id
        description: Dagster run UUID — foreign key to dagster_pipeline_runs.
        data_tests:
          - not_null
      - name: event_timestamp
        description: Unix epoch seconds (float) when the materialization was recorded.
        data_tests:
          - not_null
      - name: step_key
        description: Dagster step key — unique within a run.
        data_tests:
          - not_null
      - name: asset_key_group
        description: >
          First path segment of the Dagster asset key — the high-level group:
          ingestion | bronze | silver | gold | export.
      - name: asset_key_layer
        description: Second path segment (e.g. DDD, RFAM, bronze_aktoer).
      - name: asset_key_name
        description: Last path segment — the specific asset name.
      - name: asset_key_full
        description: Full asset key path joined with '/'.
      - name: rows_processed
        description: >
          Rows the step reports: records_written (extraction), rows_written (export) or
          silver_rows_written (Silver tables). NULL for assets that report none (Bronze,
          Gold, the _cv views).
      - name: silver_rows_inserted
        description: "Silver tables only (NULL otherwise): I rows written to the Silver table (metadata silver_rows_inserted)."
      - name: silver_rows_updated
        description: "Silver tables only (NULL otherwise): U rows written to the Silver table."
      - name: silver_rows_deleted
        description: "Silver tables only (NULL otherwise): D rows written to the Silver table."
      - name: silver_rows_written
        description: "Silver tables only (NULL otherwise): All rows written to the Silver table (I + U + D)."
      - name: silver_files_processed
        description: "Silver tables only (NULL otherwise): Bronze files the Silver run processed."

  # ---------------------------------------------------------------------------
  # Staging — Dagster pipeline runs (VIEW)
  # ---------------------------------------------------------------------------
  - name: dagster_pipeline_runs
    description: >
      One row per Dagster pipeline run. Reads directly from the Dagster SQLite
      runs database ($DAGSTER_HOME/history/runs.db) via DuckDB's sqlite_scan.
    columns:
      - name: run_id
        description: Dagster run UUID — primary key.
        data_tests:
          - not_null
          - unique
      - name: job_name
        description: Name of the Dagster job that produced this run.
      - name: run_status
        description: Terminal status — SUCCESS, FAILURE, CANCELED, etc.
      - name: run_duration_seconds
        description: Wall-clock time from start to end of the run in seconds.

  # ---------------------------------------------------------------------------
  # Dimension — Run (v2, Dagster storage/ layout)
  # ---------------------------------------------------------------------------
  - name: dagster_run
    description: >
      One row per Dagster run. Builds on dagster_pipeline_runs and dagster_event_logs
      so all SQLite access stays in one place.
      Joins: job_sk → dagster_job; start/end date/time FKs → gold.date / gold.time.
    columns:
      - name: run_sk
        description: Surrogate key — hash of run_id.
        data_tests:
          - not_null
          - unique
      - name: job_sk
        description: FK to dagster_job — hash of job_name.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dagster_job')
                field: job_key
      - name: start_date_sk
        description: FK to gold.date (date_day) for the run start.
        data_tests:
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
                where: "start_date_sk is not null"
      - name: start_time_sk
        description: FK to gold.time (time_key = 100*hour + minute, truncated to the minute) for the run start.
        data_tests:
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
                where: "start_time_sk is not null"
      - name: end_date_sk
        description: FK to gold.date (date_day) for the run end. NULL while the run is in progress.
        data_tests:
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
                where: "end_date_sk is not null"
      - name: end_time_sk
        description: FK to gold.time (time_key = 100*hour + minute) for the run end. NULL while the run is in progress.
        data_tests:
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
                where: "end_time_sk is not null"
      - name: run_id
        description: Dagster natural run UUID.
        data_tests:
          - not_null
          - unique
      - name: status
        description: Run terminal status — SUCCESS, FAILURE, CANCELED, etc.
      - name: created_at
        description: Timestamp when the run was created.
      - name: started_at
        description: Timestamp when execution started.
      - name: ended_at
        description: Timestamp when execution ended. NULL while in progress.
      - name: duration_seconds
        description: Wall-clock duration from start to end in seconds.
      - name: rows_processed
        description: Sum of rows_processed over the run's ASSET_MATERIALIZATION events (see dagster_event_logs).
      - name: assets_materialized
        description: Count of ASSET_MATERIALIZATION events within the run.
      - name: silver_rows_inserted
        description: "Summed over the run's Silver tables (NULL for a run without them): I rows written to the Silver table (metadata silver_rows_inserted)."
      - name: silver_rows_updated
        description: "Summed over the run's Silver tables (NULL for a run without them): U rows written to the Silver table."
      - name: silver_rows_deleted
        description: "Summed over the run's Silver tables (NULL for a run without them): D rows written to the Silver table."
      - name: silver_rows_written
        description: "Summed over the run's Silver tables (NULL for a run without them): All rows written to the Silver table (I + U + D)."
      - name: silver_files_processed
        description: "Summed over the run's Silver tables (NULL for a run without them): Bronze files the Silver run processed."

  # ---------------------------------------------------------------------------
  # Dimension — Asset (v2, Dagster storage/ layout)
  # ---------------------------------------------------------------------------
  - name: dagster_asset
    description: >
      One row per unique Dagster asset key ever materialized.
      Parses the raw asset_key JSON path ({"path": ["group","layer","name"]})
      into individual path segments. Surrogate key asset_sk is consistent with
      dagster_asset_materialization.asset_sk.
    columns:
      - name: asset_sk
        description: Surrogate key — hash of asset_key_raw.
        data_tests:
          - not_null
          - unique
      - name: asset_key_raw
        description: Raw asset key JSON string from Dagster event_logs.
      - name: asset_key_group
        description: First path segment — high-level group (ingestion, bronze, silver, gold, export).
      - name: asset_key_layer
        description: Second path segment — sub-group or source layer.
      - name: asset_key_name
        description: Last path segment — specific asset name.
      - name: asset_key_full
        description: Full asset key path joined with '/'.

  # ---------------------------------------------------------------------------
  # Fact — Asset materialization (v2, Dagster storage/ layout)
  # ---------------------------------------------------------------------------
  - name: dagster_asset_materialization
    description: >
      One row per ASSET_MATERIALIZATION event from $DAGSTER_HOME/storage/event_log.db.
      Step duration is derived by joining STEP_START and STEP_SUCCESS/FAILURE events.
      Date FK joins gold.date (date_day); time FK joins gold.time (time_key = minute of day).
    columns:
      - name: materialization_id
        description: Dagster event_logs PK (id column).
        data_tests:
          - not_null
          - unique
      - name: asset_sk
        description: Surrogate key — hash of asset_key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dagster_asset')
                field: asset_sk
                where: "asset_sk is not null"
      - name: run_sk
        description: FK to dagster_run — hash of run_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dagster_run')
                field: run_sk
      - name: job_sk
        description: FK to dagster_job — hash of pipeline_name.
        data_tests:
          - relationships:
              arguments:
                to: ref('dagster_job')
                field: job_key
                where: "job_sk is not null"
      - name: start_date_sk
        description: FK to gold.date (date_day) for the step start. NULL when ASSET_MATERIALIZATION_PLANNED event is absent.
        data_tests:
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
                where: "start_date_sk is not null"
      - name: start_time_sk
        description: FK to gold.time (time_key = 100*hour + minute) for the step start. NULL when ASSET_MATERIALIZATION_PLANNED event is absent.
        data_tests:
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
                where: "start_time_sk is not null"
      - name: end_date_sk
        description: FK to gold.date (date_day) for the step end — always set from the ASSET_MATERIALIZATION event timestamp.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
      - name: end_time_sk
        description: FK to gold.time (time_key = 100*hour + minute) for the step end — always set.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
      - name: run_id
        description: Dagster run UUID.
        data_tests:
          - not_null
      - name: asset_key_raw
        description: Raw asset key string from Dagster.
      - name: step_key
        description: Dagster step key — unique within a run.
      - name: partition_key
        description: Partition key if the asset is partitioned.
      - name: step_started_at
        description: Timestamp when the step started (from STEP_START event).
      - name: step_ended_at
        description: Timestamp when the step ended (from STEP_SUCCESS/FAILURE event).
      - name: materialized_at
        description: Timestamp of the ASSET_MATERIALIZATION event itself.
      - name: duration_seconds
        description: Wall-clock step duration in seconds.
      - name: rows_processed
        description: Rows the step reports, from dagster_event_logs (records_written, rows_written or silver_rows_written).
      - name: silver_rows_inserted
        description: "Silver tables only (NULL otherwise): I rows written to the Silver table (metadata silver_rows_inserted)."
      - name: silver_rows_updated
        description: "Silver tables only (NULL otherwise): U rows written to the Silver table."
      - name: silver_rows_deleted
        description: "Silver tables only (NULL otherwise): D rows written to the Silver table."
      - name: silver_rows_written
        description: "Silver tables only (NULL otherwise): All rows written to the Silver table (I + U + D)."
      - name: silver_files_processed
        description: "Silver tables only (NULL otherwise): Bronze files the Silver run processed."
      - name: step_outcome
        description: Step terminal event — STEP_SUCCESS | STEP_FAILURE | STEP_SKIPPED.

  # ---------------------------------------------------------------------------
  # Fact — Silver load history (generated VIEW, reads Silver itself)
  # ---------------------------------------------------------------------------
  - name: silver_load_history
    description: >
      One row per Silver table and dbt run that wrote rows to it or processed Bronze files
      for it, counted from Silver itself (LKHS_date_inserted and LKHS_cdc_operation) and the
      table's _files log, so the history goes back to the first load and covers runs
      outside Dagster. Generated by generate_dbt_models (macro silver_load_history).
      A run that the delete guard stopped wrote nothing and is not here; see dagster_step_failure.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - silver_table
              - loaded_at
    columns:
      - name: silver_table
        description: Silver model name, e.g. silver_ddd_aktoer.
        data_tests:
          - not_null
      - name: source_system_code
        description: DDD or RFAM.
        data_tests:
          - accepted_values:
              arguments:
                values: ['DDD', 'RFAM']
      - name: loaded_at
        description: Start of the dbt run (LKHS_date_inserted of its rows, LKHS_date_inserted of its processed files).
        data_tests:
          - not_null
      - name: load_date_sk
        description: FK to gold.date (date_day) of loaded_at.
        data_tests:
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
      - name: load_time_sk
        description: FK to gold.time (time_key = 100*hour + minute) of loaded_at.
        data_tests:
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
      - name: rows_inserted
        description: I rows the run wrote to the table.
      - name: rows_updated
        description: U rows the run wrote to the table.
      - name: rows_deleted
        description: D rows the run wrote to the table.
      - name: rows_written
        description: All rows the run wrote (I + U + D); 0 for a run that read files without a change.
      - name: files_processed
        description: Bronze files the run marked processed in the table's _files log; 0 for runs before the log existed.

  # ---------------------------------------------------------------------------
  # Staging — Step failure raw events (SQL model, TABLE)
  # ---------------------------------------------------------------------------
  - name: dagster_step_failures_raw
    description: >
      One row per failed asset per run. Reads the STEP_FAILURE events directly from
      Dagster's per-run SQLite files ($DAGSTER_HOME/history/runs/{run_id}.db, one
      sqlite_scan() per file), because they are not in index.db. Maps step_key to asset
      key(s) via ASSET_MATERIALIZATION_PLANNED events so that each row carries an
      asset_key suitable for joining to dagster_asset. A single step_key can expand
      to multiple rows when a step covers more than one planned asset (e.g. dbt_silver_assets).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_id
              - step_key
              - asset_key
    columns:
      - name: run_id
        description: Dagster run UUID.
        data_tests:
          - not_null
      - name: step_key
        description: Dagster step key that failed.
        data_tests:
          - not_null
      - name: asset_key
        description: Asset key mapped from the step via ASSET_MATERIALIZATION_PLANNED. NULL when no planned event was found.
      - name: failed_at
        description: Timestamp when the STEP_FAILURE event was recorded.
        data_tests:
          - not_null
      - name: error_class
        description: Python exception class name (e.g. DagsterExecutionStepExecutionError).
      - name: error_message
        description: Full error message text from the STEP_FAILURE event.

  # ---------------------------------------------------------------------------
  # Fact — Step failures with surrogate keys (SQL model, TABLE)
  # ---------------------------------------------------------------------------
  - name: dagster_step_failure
    description: >
      One row per failed asset per run — adds surrogate keys and date/time FKs on
      top of dagster_step_failures_raw. Joins: asset_sk → dagster_asset; run_sk →
      dagster_run; job_sk → dagster_job; date_sk → gold.date; time_sk → gold.time.
    columns:
      - name: failure_sk
        description: Surrogate key — hash of run_id || step_key.
        data_tests:
          - not_null
          - unique
      - name: asset_sk
        description: FK to dagster_asset — hash of asset_key. NULL when asset_key is NULL.
        data_tests:
          - relationships:
              arguments:
                to: ref('dagster_asset')
                field: asset_sk
                where: "asset_sk is not null"
      - name: run_sk
        description: FK to dagster_run — hash of run_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dagster_run')
                field: run_sk
      - name: job_sk
        description: FK to dagster_job — hash of job_name from dagster_pipeline_runs. NULL when the run is not found.
        data_tests:
          - relationships:
              arguments:
                to: ref('dagster_job')
                field: job_key
                where: "job_sk is not null"
      - name: date_sk
        description: FK to gold.date (date_day) derived from failed_at — always set.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('date')
                field: date_day
      - name: time_sk
        description: FK to gold.time (time_key = 100*hour + minute) derived from failed_at — always set.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('time')
                field: time_key
      - name: run_id
        description: Dagster run UUID — natural key.
        data_tests:
          - not_null
      - name: step_key
        description: Dagster step key that failed.
        data_tests:
          - not_null
      - name: asset_key
        description: Asset key — may be NULL when no ASSET_MATERIALIZATION_PLANNED event was found for the step.
      - name: error_class
        description: Python exception class name.
      - name: error_message
        description: Full error message text.
      - name: failed_at
        description: Timestamp when the step failure was recorded.
        data_tests:
          - not_null
