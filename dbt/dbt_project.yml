
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'danish_democracy_data'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'danish_democracy_data'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Create an S3 secret at the start of every dbt run when RAW_STORAGE_TARGET=s3.
# This hook covers every dbt target (local, local_ducklake, local_ducklake_s3)
# uniformly — only local_ducklake_s3 has a secrets: block in profiles.yml, while
# local and local_ducklake do not. Without this hook those targets would have no
# S3 secret and Bronze read_json_auto views (s3:// paths) would fail.
#
# The local_ducklake_s3 profiles.yml secrets: block is ALSO kept because
# secrets are created before the ATTACH runs, and DuckLake's ATTACH needs the
# S3 secret already present to reach S3-backed Parquet. The hook runs only
# after ATTACH, so it cannot substitute for the profiles.yml block there.
# (DuckDB accepts USE_SSL 'false' as a quoted string and casts it correctly,
# so there is no quoting issue with the profiles.yml secret.)
#
# ENDPOINT/URL_STYLE/USE_SSL are only emitted when S3_ENDPOINT is non-empty
# (MinIO). Omitting them lets DuckDB fall back to AWS defaults, which is
# correct for real AWS S3.
on-run-start:
  - >-
    {% if env_var('RAW_STORAGE_TARGET', 'local') == 's3' %}
    CREATE OR REPLACE SECRET ddd_s3_secret (
        TYPE s3,
        KEY_ID '{{ env_var("S3_ACCESS_KEY_ID") }}',
        SECRET '{{ env_var("S3_SECRET_ACCESS_KEY") }}'
        {% if env_var('S3_ENDPOINT', '') != '' %}
        , ENDPOINT '{{ env_var("S3_ENDPOINT").split("://")[-1] }}'
        , URL_STYLE '{{ env_var("S3_URL_STYLE", "path") }}'
        , USE_SSL {{ env_var("S3_USE_SSL", "false") }}
        {% endif %}
        , REGION '{{ env_var("S3_REGION", "us-east-1") }}'
    )
    {% endif %}

# Project variables
vars:
  bronze_columns_to_exclude_in_silver_hash: "'LKHS_date_inserted','LKHS_filename'"
  hash_null_replacement: "'<NULL>'"
  hash_delimiter: "']##['"
  # Earliest date covered by the gold `date` dimension's spine (bronze_dates.sql).
  # Must stay on or before the earliest real date in the source data (meeting /
  # case / vote dates) or the gold FK relationship tests against `date` will fail
  # for any row whose date falls before this bound.
  date_spine_start_date: "1950-01-01"

models:
  danish_democracy_data:
    # Config indicated by + and applies to all files under models/example/
    bronze:
      +schema: bronze
      +materialized: view
      +tags: ['bronze']
    silver:
      +schema: silver
      +materialized: table
      +tags: ['silver']
      +database: "{{ 'ducklake_catalog' if env_var('SILVER_STORAGE_FORMAT', 'duckdb') == 'ducklake' else env_var('DUCKDB_DATABASE', 'danish_democracy_data') }}"
    gold:
      +schema: gold
      +materialized: view
      +tags: ['gold']
    data_engineering:
      +schema: data_engineering
      +materialized: view
      +tags: ['data_engineering']