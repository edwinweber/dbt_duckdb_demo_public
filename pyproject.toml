[project]
name = "danish-democracy-data"
version = "1.0.0"
description = "Data engineering pipeline for Danish Parliament open data — extraction, medallion-architecture transformation, and Delta Lake export."
requires-python = ">=3.13"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Edwin Weber"}]
dependencies = [
    # Extraction & loading
    "dlt>=1.31.0,<2",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",

    # Azure / Fabric OneLake
    "azure-identity>=1.26.0",
    "azure-storage-file-datalake>=12.26.0",

    # Transformation
    # dbt-core is capped at <1.13 — dagster-dbt 0.29.x hard limit.
    # dbt-duckdb 1.11.0 targets dbt-core 1.11 but is compatible with 1.12.
    # Do not add dbt-oss: installing dbt-core AND dbt-oss together triggers
    # dagster-dbt issue #34215 (NoneType/enabled crash in DbtCliResource).
    "dbt-core>=1.12.6,<1.13",
    "dbt-duckdb>=1.11.0,<2",
    "duckdb>=2.0.0,<3",
    # DuckDB 2.0 needs numpy for Python UDFs (the server-side ducklake_sweep_current_temp).
    "numpy>=2.0",

    # Export to Delta Lake
    "deltalake>=1.6.6",
    "pyarrow>=25.0.0",

    # SQL source pipeline (used by dlt_pipeline_execution_functions.py)
    "sqlalchemy>=2.1.5",
    "pymysql>=1.2.3",
]

[project.scripts]
dbt-quack = "ddd_python.ddd_dbt.dbt_quack:main"

[project.urls]
Homepage = "https://github.com/edwinweber/dbt_duckdb_demo"
Repository = "https://github.com/edwinweber/dbt_duckdb_demo"
Issues = "https://github.com/edwinweber/dbt_duckdb_demo/issues"

[project.optional-dependencies]
dagster = [
    # dagster-dbt's minor version tracks dagster's (0.29.x ↔ 1.13.x); keep the
    # ranges wide enough that pip can resolve a matching dagster-dbt for whatever
    # dagster<2 it selects.
    "dagster>=1.13.26,<2",
    "dagster-webserver>=1.13.26,<2",
    "dagster-dbt>=0.29.26,<1",
    # dagster's grpc client pulls in grpcio-health-checking transitively.
    # grpcio-health-checking>=1.82 ships pb2 gencode requiring protobuf>=7.35,
    # but dagster caps protobuf<7 — cap this transitive dep too until
    # protobuf 7.x is supported upstream.
    "grpcio-health-checking<1.82",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "types-requests",  # mypy stubs for requests; without this, newer mypy raises import-untyped
    "pandas>=3.0.6",  # needed by duckdb.fetchdf() in integration tests
    "boto3>=1.34",    # S3 integration tests: bucket setup/teardown against RustFS
]

[tool.setuptools.packages.find]
include = ["ddd_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "s3_integration: tests that require a live S3-compatible endpoint (RustFS); skipped when S3_TEST_ENDPOINT is unset",
    "dbt_integration: tests that run dbt against the sample data; skipped unless DBT_INTEGRATION_TESTS=1",
]

[tool.coverage.report]
omit = [
    # Operational CLI scripts — require live databases, Azure, or Dagster state;
    # untestable in CI without those dependencies.
    "ddd_python/ddd_dlt/dlt_run_extraction_pipelines_danish_parliament_data.py",
    "ddd_python/ddd_dlt/dlt_run_extraction_pipelines_rfam.py",
    "ddd_python/ddd_utils/backup_platform.py",
    "ddd_python/ddd_utils/fabric_capacity_pause_resume.py",
    "ddd_python/ddd_utils/migrate_silver_to_ducklake.py",
    "ddd_python/ddd_utils/restore_platform.py",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults (Dagster pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # assert is fine in tests; inline test data is exempt from line-length
"scripts/*" = ["E501"]  # HTML/SQL template strings cannot be broken without changing content
# load_dotenv() must run before app imports so env vars are available at import time;
# the E402 violations below are intentional.
"ddd_python/ddd_dagster/definitions.py" = ["E402"]
"ddd_python/ddd_dagster/sensors.py" = ["E402"]
"ddd_python/ddd_dbt/dbt_build_with_unique_logfile.py" = ["E402"]
"ddd_python/ddd_dlt/dlt_pipeline_execution_functions.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ddd_python"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "dlt.*",
    "duckdb.*",
    "dagster.*",
    "dagster_dbt.*",
    "deltalake.*",
    "pyarrow.*",
    "azure.*",
    "dotenv.*",
    "dbt.*",
]
ignore_missing_imports = true

# Dagster-heavy modules: decorator patterns return opaque Dagster types;
# full annotations require importing many internal Dagster symbols that lack
# stubs. Annotations on public entry-points (execute_pipeline, etc.) are kept.
[[tool.mypy.overrides]]
module = [
    "ddd_python.ddd_dagster.dbt_assets",
    "ddd_python.ddd_dagster.jobs",
    "ddd_python.ddd_dagster.sensors",
    "ddd_python.ddd_dbt.dbt_quack",
]
disallow_untyped_defs = false

# DuckDB and PyArrow return Any through untyped stubs; warn_return_any fires
# on functions that simply pass those values through. Suppress per-module.
[[tool.mypy.overrides]]
module = [
    "ddd_python.ddd_dlt.export_silver",
    "ddd_python.ddd_dlt.export_gold",
    "ddd_python.ddd_dlt.dlt_pipeline_execution_functions",
    "ddd_python.ddd_utils.fabric_capacity_pause_resume",
]
warn_return_any = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
