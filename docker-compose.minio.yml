# docker-compose.minio.yml — Override file for local S3-compatible storage (MinIO)
#
# This file provides a MinIO service for local development with S3-compatible storage.
# It is used with the main docker-compose.yml via compose file override:
#
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up minio
#
# After starting MinIO, create the required S3 buckets using the MinIO console
# or the mc (minio-client) CLI tool. Without these buckets, extraction will fail.
#
# MinIO Console (bucket/object inspection):
#   http://localhost:9001
#   Login with S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY from .env
#
# S3 API (for dlt, duckdb, etc.):
#   http://localhost:9000
#
# Create buckets via MinIO Console:
#   1. Open http://localhost:9001
#   2. Click "Object Browser" → "+" to create a new bucket
#   3. Create buckets matching your .env: S3_BUCKET_BRONZE, S3_BUCKET_DUCKLAKE
#
# Or via mc CLI (if minio-client is installed):
#   mc alias set ddd http://localhost:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}
#   mc mb ddd/ddd-bronze
#   mc mb ddd/ddd-ducklake (if SILVER_STORAGE_FORMAT=ducklake)

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY}"
    volumes:
      - /data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
