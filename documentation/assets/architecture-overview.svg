<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 760 880" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Architecture Overview — Danish Democracy Data</title>
  <desc id="arch-desc">Medallion architecture: Danish Parliament OData API and Rfam MySQL extracted via dlt, transformed through Bronze, Silver, and Gold layers in DuckDB, exported to Delta Lake and Microsoft Fabric OneLake, consumed via Metabase and Power BI.</desc>

  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <!-- DuckDB logo (viewBox 0 0 128 128, rendered at 28×28) -->
    <symbol id="duckdb" viewBox="0 0 128 128" width="28" height="28">
      <circle cx="64" cy="64" r="64" fill="#000"/>
      <path fill="#fff100" d="M98.2 54.5H85.6v18.9h12.6c5.2 0 9.5-4.3 9.5-9.5s-4.3-9.4-9.5-9.4ZM24.2 64c0 14.6 11.9 26.5 26.5 26.5S77.2 78.6 77.2 64 65.3 37.5 50.7 37.5 24.2 49.4 24.2 64Z"/>
    </symbol>
    <!-- dlt logo (viewBox 0 0 24 24, rendered at 38×15) -->
    <symbol id="dlt-logo" viewBox="0 0 24 24" width="38" height="15">
      <path fill="#9ec5e0" d="M24 11.498h-1.008v3.01H24Zm-3.024 0h2.016v-1.004h-2.016V8.487h-1.008v7.025h3.024v-1.004h-2.016zm-2.986 3.01h-2.016v1.004h3.024v-5.017H17.99zm-2.016-4.013h-1.008v4.014h1.008zm-2.985 1.003h-2.016v-3.01H9.965v7.024h1.008v-3.01h2.016v3.01h1.008V8.488h-1.008zm-11.981 0H0v3.01h1.008zm2.016-1.003H1.008v1.003h2.016v3.01H1.008v1.004h3.024V8.488H3.024zM5 15.512h1.01V8.488H5.001Zm2.986-7.024H6.98v6.02h1.008v-3.01h1.008v-1.003H7.987zm1.008 6.02H7.987v1.004h1.008z"/>
    </symbol>
    <!-- Metabase logo (viewBox 0 0 24 24, rendered at 24×24) -->
    <symbol id="metabase-logo" viewBox="0 0 24 24" width="24" height="24">
      <path fill="#509EE3" d="M5.385 6.136c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm-1.438 2.63c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461zm5.465-2.63c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm-1.088 5.592c.794 0 1.438-.654 1.438-1.461s-.644-1.461-1.438-1.461-1.438.654-1.438 1.461.643 1.461 1.438 1.461zm5.464-5.592c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm.35-4.675c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461S11.206 0 12 0s1.438.654 1.438 1.461zm.35 8.806c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm4.376-4.131c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm2.939 1.461c.794 0 1.438-.654 1.438-1.461s-.644-1.461-1.438-1.461-1.438.654-1.438 1.461.644 1.461 1.438 1.461zm-4.027 1.209c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.643-1.461-1.438-1.461zm4.027 0c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461zM3.947 12.857a1.45 1.45 0 0 0-1.438 1.461c0 .807.644 1.461 1.438 1.461s1.438-.654 1.438-1.461a1.45 1.45 0 0 0-1.438-1.461zm5.465 1.5c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.655 1.438 1.461zM12 12.896c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461zm5.464 1.461c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.655 1.438 1.461zm2.939-1.461c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461zM3.947 16.948c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461zm5.465 1.5c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm4.376 0c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm.35 4.091c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm4.376-4.091c0 .807-.644 1.461-1.438 1.461s-1.438-.654-1.438-1.461.644-1.461 1.438-1.461 1.438.654 1.438 1.461zm2.939-1.461c-.794 0-1.438.654-1.438 1.461s.644 1.461 1.438 1.461 1.438-.654 1.438-1.461-.644-1.461-1.438-1.461z"/>
    </symbol>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="760" height="880" fill="#0f172a" rx="14"/>

  <!-- ════════════════════════════════════════════════════
       SECTION HEADERS
       ════════════════════════════════════════════════════ -->
  <text x="30" y="34" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">DATA SOURCES</text>
  <text x="554" y="34" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">ORCHESTRATION</text>

  <!-- ════════════════════════════════════════════════════
       DATA SOURCE BOXES  (y 44 – 124)
       ════════════════════════════════════════════════════ -->

  <!-- Danish Parliament -->
  <rect x="30" y="44" width="220" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Danish flag (red with white cross) -->
  <rect x="44" y="58" width="36" height="26" rx="3" fill="#C60C30"/>
  <rect x="54" y="58" width="6"  height="26" fill="#fff"/>
  <rect x="44" y="69" width="36" height="5"  fill="#fff"/>
  <text x="88" y="74" font-size="12" font-weight="600" fill="#e2e8f0">Danish Parliament</text>
  <text x="88" y="89" font-size="11"             fill="#94a3b8">OData API</text>
  <use href="#dlt-logo" x="42" y="98"/>
  <text x="86" y="110" font-size="10" fill="#64748b">Data Load Tool</text>

  <!-- Rfam MySQL -->
  <rect x="278" y="44" width="220" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- MySQL badge -->
  <rect x="292" y="58" width="36" height="26" rx="3" fill="#00618a"/>
  <text x="296" y="70" font-size="7" font-weight="700" fill="#f5f5f5">My</text>
  <text x="296" y="80" font-size="7" font-weight="700" fill="#e8982f">SQL</text>
  <text x="336" y="74" font-size="12" font-weight="600" fill="#e2e8f0">Rfam Database</text>
  <text x="336" y="89" font-size="11"             fill="#94a3b8">public MySQL</text>
  <use href="#dlt-logo" x="290" y="98"/>
  <text x="334" y="110" font-size="10" fill="#64748b">Data Load Tool</text>

  <!-- ════════════════════════════════════════════════════
       DAGSTER (right sidebar, matches source box row)
       ════════════════════════════════════════════════════ -->
  <rect x="554" y="44" width="180" height="80" rx="10" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5"/>
  <!-- Dagster diamond -->
  <polygon points="572,84  584,64  596,84  584,104" fill="#4f46e5"/>
  <text x="606" y="73" font-size="13" font-weight="600" fill="#e2e8f0">Dagster</text>
  <text x="606" y="89" font-size="10"             fill="#94a3b8">software-defined assets</text>
  <text x="606" y="103" font-size="10"            fill="#94a3b8">daily schedules</text>

  <!-- ════════════════════════════════════════════════════
       dlt FLOW ARROWS  (y 124 – 176)
       ════════════════════════════════════════════════════ -->
  <line x1="140" y1="124" x2="140" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="388" y1="124" x2="388" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="152" y="156" font-size="10" fill="#64748b">JSON files</text>
  <text x="400" y="156" font-size="10" fill="#64748b">JSON files</text>

  <!-- ════════════════════════════════════════════════════
       BRONZE LAYER  (y 176 – 296)
       ════════════════════════════════════════════════════ -->
  <rect x="30" y="176" width="504" height="120" rx="10" fill="#1c1a0f" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- top colour strip -->
  <rect x="30" y="176" width="504" height="4" rx="2" fill="#d97706" opacity="0.8"/>
  <!-- layer badge -->
  <rect x="44" y="190" width="62" height="18" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1"/>
  <text x="75" y="203" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle" letter-spacing="0.5">BRONZE</text>
  <!-- DuckDB icon + content -->
  <use href="#duckdb" x="44" y="218"/>
  <text x="82" y="232" font-size="14" font-weight="600" fill="#e2e8f0">DuckDB views</text>
  <text x="82" y="250" font-size="11"             fill="#94a3b8">read_json_auto over raw files</text>
  <!-- lower label row -->
  <text x="44" y="278" font-size="11" fill="#64748b">Hash-based CDC  ·  SCD Type 2</text>

  <!-- ════════════════════════════════════════════════════
       DOCKER COMPOSE (right sidebar, beside Bronze)
       ════════════════════════════════════════════════════ -->
  <rect x="554" y="176" width="180" height="60" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <!-- Docker whale (simplified) -->
  <rect x="568" y="192" width="28" height="20" rx="4" fill="#0ea5e9"/>
  <text x="569" y="198" font-size="7" fill="#fff" font-weight="700">D</text>
  <rect x="570" y="188" width="6"  height="4" rx="1" fill="#0ea5e9"/>
  <rect x="578" y="186" width="6"  height="6" rx="1" fill="#0ea5e9"/>
  <text x="604" y="202" font-size="12" font-weight="600" fill="#e2e8f0">Docker</text>
  <text x="604" y="218" font-size="10"             fill="#94a3b8">Compose</text>

  <!-- ════════════════════════════════════════════════════
       BRONZE → SILVER CONNECTOR  (y 296 – 340)
       ════════════════════════════════════════════════════ -->
  <line x1="282" y1="296" x2="282" y2="338" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════
       SILVER LAYER  (y 340 – 478)
       ════════════════════════════════════════════════════ -->
  <rect x="30" y="340" width="504" height="138" rx="10" fill="#131921" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="30" y="340" width="504" height="4" rx="2" fill="#94a3b8" opacity="0.6"/>
  <!-- layer badge -->
  <rect x="44" y="354" width="56" height="18" rx="4" fill="#94a3b8" fill-opacity="0.12" stroke="#94a3b8" stroke-width="1"/>
  <text x="72" y="367" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SILVER</text>
  <!-- DuckDB icon -->
  <use href="#duckdb" x="44" y="382"/>
  <!-- DuckLake badge (text, since no SVG logo) -->
  <rect x="82" y="382" width="68" height="20" rx="4" fill="#1e3a4a" stroke="#38bdf8" stroke-width="1"/>
  <text x="116" y="396" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">DuckLake</text>
  <!-- Content -->
  <text x="162" y="396" font-size="14" font-weight="600" fill="#e2e8f0">models</text>
  <text x="44" y="420" font-size="11"  fill="#94a3b8">DuckDB tables  OR  DuckLake Parquet</text>
  <!-- SILVER_STORAGE_FORMAT toggle hint -->
  <rect x="44" y="432" width="12" height="12" rx="6" fill="#334155"/>
  <rect x="44" y="432" width="6"  height="12" rx="6" fill="#38bdf8"/>
  <text x="62" y="442" font-size="10" fill="#64748b">SILVER_STORAGE_FORMAT env var</text>
  <!-- lower label -->
  <text x="44" y="462" font-size="11" fill="#64748b">Star-schema modelling</text>

  <!-- ════════════════════════════════════════════════════
       PYTHON (right sidebar, beside Silver)
       ════════════════════════════════════════════════════ -->
  <rect x="554" y="340" width="180" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Python two-tone circles -->
  <circle cx="582" cy="363" r="12" fill="#306998"/>
  <circle cx="582" cy="375" r="10" fill="#FFD43B"/>
  <text x="602" y="363" font-size="12" font-weight="600" fill="#e2e8f0">Python</text>
  <text x="602" y="379" font-size="10"             fill="#94a3b8">3.12</text>

  <!-- ════════════════════════════════════════════════════
       SILVER → GOLD CONNECTOR  (y 478 – 516)
       ════════════════════════════════════════════════════ -->
  <line x1="282" y1="478" x2="282" y2="514" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════
       GOLD LAYER  (y 516 – 614)
       ════════════════════════════════════════════════════ -->
  <rect x="30" y="516" width="504" height="98" rx="10" fill="#1a1500" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7"/>
  <rect x="30" y="516" width="504" height="4" rx="2" fill="#f59e0b" opacity="0.8"/>
  <!-- layer badge -->
  <rect x="44" y="530" width="44" height="18" rx="4" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1"/>
  <text x="66" y="543" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">GOLD</text>
  <!-- DuckDB icon + content -->
  <use href="#duckdb" x="44" y="558"/>
  <text x="82" y="573" font-size="14" font-weight="600" fill="#e2e8f0">views</text>
  <text x="82" y="591" font-size="11"             fill="#94a3b8">facts &amp; dimensions</text>

  <!-- ════════════════════════════════════════════════════
       GOLD → EXPORT CONNECTOR  (y 614 – 648)
       ════════════════════════════════════════════════════ -->
  <line x1="282" y1="614" x2="282" y2="646" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════
       EXPORT ROW  (y 648 – 724)
       ════════════════════════════════════════════════════ -->

  <!-- Delta Lake → local filesystem -->
  <rect x="30" y="648" width="240" height="76" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Delta Lake triangle logo -->
  <polygon points="60,708  80,678  100,708" fill="#00add4" opacity="0.9"/>
  <line x1="70" y1="708" x2="90" y2="708" stroke="#00add4" stroke-width="2"/>
  <text x="114" y="670" font-size="12" font-weight="600" fill="#e2e8f0">Delta Lake</text>
  <text x="114" y="687" font-size="10"             fill="#94a3b8">→ local filesystem</text>
  <text x="114" y="703" font-size="10"             fill="#64748b">DuckDB write via PyArrow</text>

  <!-- Microsoft Fabric / OneLake → cloud -->
  <rect x="294" y="648" width="240" height="76" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Fabric icon (simplified colored squares) -->
  <rect x="308" y="664" width="12" height="12" rx="2" fill="#742774"/>
  <rect x="322" y="664" width="12" height="12" rx="2" fill="#0078d4"/>
  <rect x="308" y="678" width="12" height="12" rx="2" fill="#00b4e0"/>
  <rect x="322" y="678" width="12" height="12" rx="2" fill="#742774"/>
  <text x="346" y="670" font-size="12" font-weight="600" fill="#e2e8f0">Microsoft Fabric</text>
  <text x="346" y="684" font-size="11"             fill="#94a3b8">OneLake</text>
  <text x="308" y="710" font-size="10"             fill="#94a3b8">→ cloud export</text>

  <!-- ════════════════════════════════════════════════════
       BUSINESS INTELLIGENCE BAND  (y 738 – 762)
       ════════════════════════════════════════════════════ -->
  <rect x="30" y="738" width="504" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="282" y="755" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">BUSINESS INTELLIGENCE</text>

  <!-- ════════════════════════════════════════════════════
       CONSUMPTION ROW  (y 772 – 852)
       ════════════════════════════════════════════════════ -->

  <!-- Metabase -->
  <rect x="30" y="772" width="240" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <use href="#metabase-logo" x="44" y="790"/>
  <text x="76" y="800" font-size="12" font-weight="600" fill="#e2e8f0">Metabase</text>
  <text x="76" y="815" font-size="10"             fill="#94a3b8">dashboards</text>
  <text x="44" y="836" font-size="10"             fill="#64748b">read-only DuckDB connection</text>

  <!-- Power BI -->
  <rect x="294" y="772" width="240" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Power BI icon (simplified yellow bar chart) -->
  <rect x="308" y="790" width="8"  height="26" rx="1" fill="#f2c811"/>
  <rect x="320" y="800" width="8"  height="16" rx="1" fill="#f2c811" opacity="0.8"/>
  <rect x="332" y="795" width="8"  height="21" rx="1" fill="#f2c811" opacity="0.6"/>
  <text x="350" y="800" font-size="12" font-weight="600" fill="#e2e8f0">Power BI</text>
  <text x="350" y="815" font-size="10"             fill="#94a3b8">reports</text>
  <text x="308" y="836" font-size="10"             fill="#64748b">connect to Fabric / OneLake</text>

</svg>
